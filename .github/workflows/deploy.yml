on:
  push:
    branches: [ master_integration ]   # was: main
    paths-ignore:                      # doc-only changes don't need a prod redeploy
      - '**.md'

permissions: { id-token: write, contents: read }   # OIDC
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      # ── Timezone guard ───────────────────────────────────────────────────────
      # Fails the build on a server-clock read (DateTime.Now / .ToLocalTime()) or a business
      # "today" derived from DateTime.UtcNow.Date. Both are invisible in development — the CI
      # runner and the Azure Linux plan are UTC — and wrong in Cairo, where UtcNow.Date is still
      # yesterday between midnight and 2-3 AM. Deliberate exceptions live in the script's ALLOW
      # list with their reason. See TIMEZONE_STANDARD.md.
      - name: 'Gate: no server-clock or UTC-day derivations'
        run: ./scripts/check-datetime-usage.sh

      # ── EF migrations ────────────────────────────────────────────────────────
      # Generate an IDEMPOTENT migration script from the committed migrations and apply it to
      # Azure SQL BEFORE the new app version is swapped in. Migrations are NOT applied at app
      # startup (MigrateAsync was removed to avoid cold-start/multi-instance races), so this step
      # is the ONLY place the schema is updated. Previously this was an empty comment, which left
      # prod's schema frozen — do not remove it.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Generate idempotent migration script
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project Edvanz.Infrastructure --startup-project Edvanz.API \
            -o migrate.sql
          echo "---- migrate.sql (head) ----"; head -n 40 migrate.sql

      # ── Migration gates (run BEFORE anything touches Azure) ─────────────────
      # Gate 1: the committed migrations must fully cover the EF model. A commit that
      # changes an entity/OnModelCreating without adding a migration would otherwise ship
      # code whose queries assume schema prod doesn't have — reject it here.
      - name: 'Gate: model has no unmigrated changes'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! dotnet ef migrations has-pending-model-changes \
               --project Edvanz.Infrastructure --startup-project Edvanz.API; then
            echo "::error::EF model has changes not covered by any migration. Run 'dotnet ef migrations add <Name>' and commit it."
            exit 1
          fi

      # Gate 2: rehearse the EXACT migrate.sql on a throwaway SQL Server before prod.
      # Applied twice with -b (abort on first error): the first run catches migrations
      # that cannot build a database from scratch (BUG-9 duplicate lineages) and batches
      # that fail compile-time binding (BUG-10 same-batch column backfill); the second
      # run proves the idempotent history-guards hold. Data-dependent prod failures are
      # covered by -b on the prod apply step below. '-I' (QUOTED_IDENTIFIER ON) is required:
      # the image's ODBC sqlcmd defaults it OFF and every filtered index in the script
      # fails with Msg 1934 without it (go-sqlcmd on the prod step defaults it ON).
      - name: 'Gate: migrations apply cleanly to a fresh database'
        run: |
          GATE_PW="Aa1!$(openssl rand -hex 12)"
          docker run -d --name sqlgate \
            -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$GATE_PW" \
            mcr.microsoft.com/mssql/server:2022-latest
          TOOLS=/opt/mssql-tools18/bin
          echo "Waiting for SQL Server to accept connections..."
          for i in $(seq 1 60); do
            if docker exec sqlgate $TOOLS/sqlcmd -C -S localhost -U sa -P "$GATE_PW" -Q "SELECT 1" >/dev/null 2>&1; then
              READY=1; break
            fi
            sleep 2
          done
          if [ -z "$READY" ]; then echo "::error::Gate SQL Server never became ready"; docker logs sqlgate | tail -20; exit 1; fi
          docker exec sqlgate $TOOLS/sqlcmd -C -I -b -S localhost -U sa -P "$GATE_PW" -Q "CREATE DATABASE EdvanzGate"
          docker cp migrate.sql sqlgate:/tmp/migrate.sql
          echo "Rehearsal 1/2 — fresh database..."
          docker exec sqlgate $TOOLS/sqlcmd -C -I -b -S localhost -U sa -P "$GATE_PW" -d EdvanzGate -i /tmp/migrate.sql
          echo "Rehearsal 2/2 — idempotent re-run..."
          docker exec sqlgate $TOOLS/sqlcmd -C -I -b -S localhost -U sa -P "$GATE_PW" -d EdvanzGate -i /tmp/migrate.sql
          docker rm -f sqlgate >/dev/null
          echo "migrate.sql verified: builds a fresh DB and re-runs idempotently."

      # SELF-CONTAINED publish (bundles .NET 10 runtime — immune to platform rollout)
      - run: dotnet publish Edvanz.API -c Release -r linux-x64 --self-contained true -o ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Inject the DB connection string into Azure App Service configuration from the secret, so it
      # is NEVER committed to the repo (appsettings.Production.json intentionally has no "con").
      # Runs BEFORE deploy and fail-fast: if it errors, the job stops and the running app is left
      # untouched. Only writes when the value actually changed: an unconditional write restarts the
      # site on EVERY deploy, and that extra restart raced the OneDeploy restart — first containers
      # sometimes booted without the app setting, fell back to the committed (rotated) connection
      # string, crashed with SQL login error 18456, and Azure retried the container (the "slow
      # deploys" of 2026-07-10..12; see /home/LogFiles/StartupLogs/*_failure.log).
      - name: Set DB connection string in App Service config
        env:
          PROD_SQL_CONNECTION: ${{ secrets.PROD_SQL_CONNECTION }}
        run: |
          RG=$(az webapp list --query "[?name=='app-edvanz-api-prod'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then echo "Could not resolve resource group for app-edvanz-api-prod"; exit 1; fi
          echo "Resource group: $RG"
          echo "RG=$RG" >> "$GITHUB_ENV"
          CURRENT=$(az webapp config appsettings list \
            --name app-edvanz-api-prod --resource-group "$RG" \
            --query "[?name=='ConnectionStrings__con'].value | [0]" -o tsv)
          if [ "$CURRENT" = "$PROD_SQL_CONNECTION" ]; then
            echo "App setting ConnectionStrings__con already up to date — skipping write (avoids a site restart)."
          else
            az webapp config appsettings set \
              --name app-edvanz-api-prod --resource-group "$RG" \
              --settings "ConnectionStrings__con=$PROD_SQL_CONNECTION" \
              --output none
            echo "App setting ConnectionStrings__con updated."
          fi

      # Apply the migration script to Azure SQL. azure/sql-action opens a temporary firewall rule
      # for the runner using the azure/login session above and removes it afterwards.
      # Requires repo secret PROD_SQL_CONNECTION (an ADO.NET connection string to the prod DB).
      # The azure/login identity must be allowed to manage the SQL server's firewall rules.
      # '-b' is LOAD-BEARING: without it go-sqlcmd rolls back only the failing migration's
      # transaction, keeps executing, and exits 0 — a broken migration is silently skipped
      # while the code that needs it still deploys (root cause of the 2026-07-15/16
      # attendance outage, BUG-10). With -b any SQL error aborts here with a non-zero exit,
      # so the job stops BEFORE 'az webapp deploy' and prod code/schema never diverge.
      # Enabled 2026-07-16 after the parent-phone index backlog was cleared by
      # 20260715231605_RepairTeacherStudentPhoneIndexes.
      - name: Apply EF migrations to Azure SQL
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.PROD_SQL_CONNECTION }}
          path: ./migrate.sql
          arguments: '-b'

      # WEBSITE_RUN_FROM_PACKAGE=1 was tried on 2026-07-12 and is INERT on this Linux web
      # app (no package stored in /home/data/SitePackages; the site kept serving loose
      # wwwroot files) — the "=1" mode is effectively Windows/Functions-only. An ignored
      # setting is a landmine (a platform update could suddenly enforce it and break boot),
      # so remove it if present. No-op (and no restart) on every run after the first.
      - name: Remove inert WEBSITE_RUN_FROM_PACKAGE setting
        run: |
          RFP=$(az webapp config appsettings list \
            --name app-edvanz-api-prod --resource-group "$RG" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" -o tsv)
          if [ -n "$RFP" ]; then
            az webapp config appsettings delete \
              --name app-edvanz-api-prod --resource-group "$RG" \
              --setting-names WEBSITE_RUN_FROM_PACKAGE \
              --output none
            echo "Removed inert WEBSITE_RUN_FROM_PACKAGE (was '$RFP')."
          else
            echo "WEBSITE_RUN_FROM_PACKAGE not set — nothing to do."
          fi

      # Explicit zip deploy via OneDeploy: one artifact upload, server-side extraction,
      # single restart — measured a clean 63s swap with no throwaway container. Kept over
      # azure/webapps-deploy for determinism.
      - name: Package publish output
        run: cd publish && zip -qr ../package.zip .

      # ASYNC deploy + explicit verification. The synchronous CLI wait blocked the job
      # for a full 10 minutes whenever the first replacement container hit the
      # stale-app-settings boot crash (Azure-side; Azure auto-replaces the container)
      # and then reported a FALSE failure ("site failed to start within 10 mins") —
      # runs 29199123220 (marked failed, code actually shipped with the next run),
      # 29199655347 and 29204099544 (rescued by the old record-check fallback, ~13 min
      # each). Async returns as soon as the artifact is accepted; we then verify what
      # actually matters, with bounded budgets:
      #   1) the deployment record reaches status 4 (deployed) + active=true — Kudu
      #      finished extracting and registered the deployment (seconds, cap 2 min);
      #   2) /health/live (anonymous) returns 200 — the NEW process is serving; then
      #   3) /health/db (anonymous, SQL-only) returns 200 — the process can actually reach SQL.
      #      A persistent DB-login failure now boots the app DEGRADED instead of crash-looping,
      #      so (2) can be green on a bad/duplicate credential; (3) is what gates DB health.
      # If (2) misses its budget, App Service is still cycling the container through the known
      # boot quirk: warn and exit 0 — the job never sits blind for 10 minutes. If (2) holds but
      # (3) fails, the build is up but cannot reach SQL — a REAL failure, exit 1.
      - name: Deploy zip to App Service (async + verify)
        run: |
          # --track-status false is CRITICAL: without it the CLI polls the CONTAINER
          # startup and hard-fails ("site failed to start within 10 mins", exit 1) on the
          # known slow first-boot swap — pre-empting the explicit verification below and
          # marking the whole run RED even though the deploy shipped (run 29226258552,
          # 2026-07-13). --async true alone did NOT stop that tracking. We upload here, then
          # verify the deployment record + /health/live ourselves in the steps below.
          az webapp deploy \
            --resource-group "$RG" --name app-edvanz-api-prod \
            --src-path package.zip --type zip --async true --track-status false

          SUB=$(az account show --query id -o tsv)
          DEP_URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Web/sites/app-edvanz-api-prod/deployments?api-version=2023-12-01"

          echo "Waiting for the deployment record to reach deployed+active (max 2 min)..."
          DEP_STATUS=""; DEP_ACTIVE=""
          for i in $(seq 1 24); do
            DEP_STATUS=$(az rest --method get --url "$DEP_URL" --query "value[0].properties.status" -o tsv)
            DEP_ACTIVE=$(az rest --method get --url "$DEP_URL" --query "value[0].properties.active" -o tsv | tr '[:upper:]' '[:lower:]')
            if [ "$DEP_STATUS" = "4" ] && [ "$DEP_ACTIVE" = "true" ]; then
              echo "Deployment record: deployed + active (~$((i*5))s)."
              break
            fi
            if [ "$DEP_STATUS" = "3" ]; then
              echo "Deployment record reports FAILED (status=3) — real failure."
              exit 1
            fi
            sleep 5
          done
          if [ "$DEP_STATUS" != "4" ] || [ "$DEP_ACTIVE" != "true" ]; then
            echo "Deployment record not deployed+active after 2 min (status=$DEP_STATUS active=$DEP_ACTIVE) — real failure."
            exit 1
          fi

          echo "Phase 1 — polling /health/live for the new process (max 5 min)..."
          LIVE_UP=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 \
              https://app-edvanz-api-prod.azurewebsites.net/health/live || true)
            if [ "$CODE" = "200" ]; then
              echo "Process is up (live 200 after ~$((i*10))s)."
              LIVE_UP=1
              break
            fi
            sleep 10
          done
          if [ -z "$LIVE_UP" ]; then
            echo "::warning::Deployment is active but /health/live has not reported healthy within 5 min — App Service is still retrying the container (known stale-settings boot quirk). The swap completes on Azure's side; check /health/live in a few minutes."
            exit 0
          fi

          # Phase 2 — the process is up; confirm it can actually reach SQL. A persistent SQL-login
          # failure no longer crash-loops (the app boots DEGRADED), so /health/live can be 200 while
          # the DB is unreachable. /health/db (anonymous, SQL-only) returns 503 in that case — a REAL,
          # non-self-healing failure (wrong/duplicate ConnectionStrings:con) — so fail the release
          # instead of shipping a build that 500s on every DB call.
          echo "Phase 2 — polling /health/db for SQL connectivity (max 2 min)..."
          for i in $(seq 1 12); do
            DB=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 \
              https://app-edvanz-api-prod.azurewebsites.net/health/db || true)
            if [ "$DB" = "200" ]; then
              echo "Database reachable (health/db 200 after ~$((i*10))s). Deploy verified."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Process is up but /health/db is not healthy after 2 min — the new build cannot reach SQL (check ConnectionStrings:con for a wrong/duplicate password). Failing the deploy."
          exit 1
